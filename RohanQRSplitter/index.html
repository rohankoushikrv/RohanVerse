<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Splitter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Proprietor Prashanth Gajulapalle</p>
          <h1>Rohan QR Splitter</h1>
        </div>
      </header>

      <section class="panel form-panel">
        <form id="split-form">
          <div class="field-grid">
            <label class="field">
              Total amount
              <input id="total-amount" type="number" min="1" step="0.01" value="4500" required />
            </label>

            <label class="field">
              Split count
              <input id="split-count" type="number" min="1" step="1" value="3" required />
            </label>

            <label class="field">
              Per-person amount
              <input id="per-person-amount" type="number" min="1" step="0.01" value="1500" placeholder="1500" />
            </label>

            <label class="field" style="grid-column: 1 / -1;">
              <span style="display:flex; align-items:center; gap:10px;">
                <input id="manual-split-toggle" type="checkbox" style="width:18px; height:18px; margin:0; accent-color:#60a5fa;" />
                Use manual split count
              </span>
              <small style="color:#9db0c8; font-weight:500;">If this is left unchecked, the app automatically calculates the split count using the total and per-person amount.</small>
            </label>

            <label class="field">
              Merchant UPI ID
              <input id="merchant-upi" type="text" value="merchant@upi" required />
            </label>

            <label class="field">
              Merchant name
              <input id="merchant-name" type="text" value="Rohan Store" required />
            </label>

            <label class="field" style="grid-column: 1 / -1;">
              Payment note
              <input id="note" type="text" value="Bill split" />
            </label>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Generate QR split</button>
            <button class="secondary" type="button" id="reset-button">Reset</button>
          </div>
        </form>
      </section>

      <section class="summary" aria-label="Summary">
        <div class="stat">
          <span>Total</span>
          <strong id="summary-total">₹4,500.00</strong>
        </div>

        <div class="stat">
          <span>Per share</span>
          <strong id="summary-share">₹1,500.00</strong>
        </div>

        <div class="stat">
          <span>Count</span>
          <strong id="summary-count">3 shares</strong>
        </div>
      </section>

      <section class="panel results-panel" aria-live="polite">
        <div class="results-header">
          <h2>Split summary</h2>
          <span id="result-status">Ready</span>
        </div>
        <div id="split-results" class="split-results"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
