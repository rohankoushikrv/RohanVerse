<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYC_L0G | 6-Month Forecast</title>
    <style>
        :root {
            --neon-purple: #bc13fe;
            --neon-cyan: #0ff;
            --dark-bg: #050505;
            --card-bg: #111114;
            --text-main: #f0f0f0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .config-panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #222;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
        }

        .input-row { display: flex; gap: 15px; margin-top: 15px; }
        .input-group { flex: 1; text-align: left; }
        
        label { font-size: 0.7rem; color: #777; text-transform: uppercase; display: block; margin-bottom: 5px; }
        input {
            width: 100%;
            background: #1a1a20;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
            color: white;
            box-sizing: border-box;
        }

        .forecast-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cycle-card {
            background: #16161a;
            border-radius: 16px;
            padding: 15px;
            border-left: 4px solid var(--neon-purple);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .cycle-card:hover { border-left-color: var(--neon-cyan); background: #1c1c22; }

        .date-main { font-weight: bold; font-size: 1.1rem; }
        .month-name { color: var(--neon-cyan); font-size: 0.8rem; text-transform: uppercase; }
        .prediction-pill {
            background: rgba(188, 19, 254, 0.1);
            color: var(--neon-purple);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .details-small { font-size: 0.75rem; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

<div class="config-panel">
    <h1>Rohan PMS CYC L0G FORECAST</h1>
    <div class="input-row">
        <div class="input-group">
            <label>Start of Last Period</label>
            <input type="date" id="startDate" value="2026-08-05">
        </div>
        <div class="input-group">
            <label>Cycle Days</label>
            <input type="number" id="cycleLength" value="25">
        </div>
    </div>
</div>

<div class="forecast-container" id="forecast">
    <!-- Forecasted months will appear here -->
</div>
<!-- Replace your current <footer> block with this -->
<footer class="cyber-footer">
    <div class="footer-content">
        <p class="copyright">
            &copy; 2026 <a href="https://github.io" class="rohan-link">Rohan Koushik Gajulapalle</a>. All rights reserved.
        </p>
        <p class="powered-by">
            Powered by <a href="https://github.io" class="gpt-link">RohanGPT</a>
        </p>
        <div class="love-note">
            Made with love for <span class="highlight">Sai Satvika</span> <span class="heart">❤️</span>
        </div>
    </div>
</footer>

<script>
    function generateForecast() {
        const startInput = document.getElementById('startDate').value;
        const cycle = parseInt(document.getElementById('cycleLength').value);
        const container = document.getElementById('forecast');
        
        if (!startInput) return;
        container.innerHTML = '';

        let currentDate = new Date(startInput);
        const options = { day: 'numeric', month: 'short', year: 'numeric' };

        for (let i = 0; i < 6; i++) {
            // Calculate next period start (official medical logic: start to start)
            currentDate.setDate(currentDate.getDate() + cycle);
            
            // Calculate Ovulation (approx 14 days before next period)
            let ovulation = new Date(currentDate);
            ovulation.setDate(currentDate.getDate() - 14);

            const card = document.createElement('div');
            card.className = 'cycle-card';
            card.innerHTML = `
                <div>
                    <div class="month-name">${currentDate.toLocaleString('en-US', {month: 'long'})}</div>
                    <div class="date-main">Starts ${currentDate.toLocaleDateString('en-US', options)}</div>
                    <div class="details-small">Predicted Ovulation: ${ovulation.toLocaleDateString('en-US', {day: 'numeric', month: 'short'})}</div>
                </div>
                <div class="prediction-pill">PREDICTED</div>
            `;
            container.appendChild(card);
        }
    }

    // Auto-run on change
    document.getElementById('startDate').addEventListener('change', generateForecast);
    document.getElementById('cycleLength').addEventListener('input', generateForecast);
    
    // Initial load
    generateForecast();
</script>
<style>
    /* Add this to your existing CSS styles */
    .cyber-footer {
        width: 100%;
        margin-top: auto;
        padding: 40px 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #050505;
        font-family: 'Inter', system-ui, sans-serif;
    }

    .footer-content {
        max-width: 450px;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 12px; /* Uniform spacing between elements */
    }

    .cyber-footer p {
        margin: 0;
        font-size: 0.85rem;
        color: #77777e;
        letter-spacing: 0.5px;
    }

    /* Fixed the dark blue links so they pop out */
    .cyber-footer a {
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    .rohan-link {
        color: #00ffff !important; /* Cyber Cyan */
    }

    .gpt-link {
        color: #bc13fe !important; /* Neon Purple */
    }

    .cyber-footer a:hover {
        filter: brightness(1.2);
    }

    /* Upgraded Gen Z Love Note with dynamic glow effect */
    .love-note {
        font-size: 0.9rem;
        color: #f0f0f0;
        margin-top: 8px;
        font-weight: 500;
        letter-spacing: 1px;
    }

    .love-note .highlight {
        background: linear-gradient(45deg, #ff007f, #bc13fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: bold;
    }

    .love-note .heart {
        display: inline-block;
        animation: pulse 1.5s infinite;
        filter: drop-shadow(0 0 5px rgba(255, 0, 127, 0.6));
    }

    /* Subtle pulse animation for the heart icon */
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }
</style>
</body>
</html>
