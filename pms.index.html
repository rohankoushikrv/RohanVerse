<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE CHECK | Cycle Tracker</title>
    <style>
        :root {
            --neon-purple: #bc13fe;
            --neon-cyan: #0ff;
            --dark-bg: #0a0a0c;
            --card-bg: #16161a;
            --text-main: #e0e0e0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Neon Glow Background */
        body::before {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--neon-purple);
            filter: blur(150px);
            opacity: 0.15;
            top: -100px;
            left: -100px;
            z-index: -1;
        }

        .tracker-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: -1px;
            margin-bottom: 2rem;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: #23232a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        input:focus { border-color: var(--neon-cyan); }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 2rem;
        }

        .stat-card {
            background: #1d1d24;
            padding: 15px;
            border-radius: 16px;
            border-bottom: 2px solid var(--neon-purple);
        }

        .stat-card.cyan { border-bottom-color: var(--neon-cyan); }

        .stat-label { font-size: 0.7rem; color: #aaa; display: block; margin-bottom: 5px; }
        .stat-value { font-weight: bold; font-size: 1rem; color: #fff; }

        .btn-update {
            width: 100%;
            background: linear-gradient(45deg, var(--neon-purple), #8a2be2);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: bold;
            margin-top: 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="tracker-card">
    <h1>FL0W_CHECK</h1>
    
    <div class="input-group">
        <label>Last Period Start</label>
        <input type="date" id="lastDate" value="2026-08-05">
    </div>

    <div class="input-group">
        <label>Cycle Length (Days)</label>
        <input type="number" id="cycleDays" value="28">
    </div>

    <div class="result-grid">
        <div class="stat-card">
            <span class="stat-label">OCTOBER START</span>
            <div class="stat-value" id="octStart">Oct 29, 2026</div>
        </div>
        <div class="stat-card cyan">
            <span class="stat-label">FERTILE START</span>
            <div class="stat-value" id="octFertile">Oct 08</div>
        </div>
    </div>

    <button class="btn-update" onclick="updateTracker()">Recalculate Vibe</button>
</div>

<script>
    function updateTracker() {
        const lastDateInput = document.getElementById('lastDate').value;
        const cycleLength = parseInt(document.getElementById('cycleDays').value);

        if (!lastDateInput) return;

        let date = new Date(lastDateInput);
        
        // Calculate 2 cycles ahead to get to October
        // Cycle 1 (September)
        date.setDate(date.getDate() + cycleLength);
        // Cycle 2 (October)
        date.setDate(date.getDate() + cycleLength);

        // Update October Start
        const options = { month: 'short', day: '2-digit', year: 'numeric' };
        document.getElementById('octStart').innerText = date.toLocaleDateString('en-US', options);

        // Fertile Window is roughly 14 days before start
        let fertileDate = new Date(date);
        fertileDate.setDate(date.getDate() - 14 - 7); // Start of window
        
        const fertileOptions = { month: 'short', day: '2-digit' };
        document.getElementById('octFertile').innerText = fertileDate.toLocaleDateString('en-US', fertileOptions);
    }
</script>

</body>
</html>
